# Diss production stack for a single VPS.
#
# Assumes Caddy already runs on this host attached to an external docker
# network named "web" and owns ports 80/443 — see caddy-snippet.txt for the
# Caddyfile additions. Nothing here publishes 80/443.
#
# REVIEW BEFORE FIRST USE — see README.md in this directory.

name: diss

services:
  diss-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATABASE_PATH: /data/diss.db
      RECORDINGS_DIR: /data/recordings
      # Browsers connect to the public LiveKit domain (via Caddy):
      LIVEKIT_URL: wss://${LIVEKIT_DOMAIN}
      # The backend talks to LiveKit over the internal network:
      LIVEKIT_API_URL: http://livekit:7880
      CORS_ORIGIN: https://${APP_DOMAIN}
      EGRESS_ENABLED: ${EGRESS_ENABLED:-true}
      # SESSION_SECRET, LIVEKIT_API_KEY, LIVEKIT_API_SECRET come from .env
    volumes:
      # SQLite DB + recordings live on the host so upgrades keep data.
      - ./data/server:/data
    networks:
      - web
      - internal
    depends_on:
      - livekit

  diss-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web

  livekit:
    image: livekit/livekit-server:v1.9
    restart: unless-stopped
    environment:
      # Config lives here (not a mounted file) so the domains come from .env
      # and there is no "edit this file before deploying" step to forget.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      # NB: the env var is LIVEKIT_CONFIG (the --config-body flag's env var),
      # NOT LIVEKIT_CONFIG_BODY. With the wrong name livekit starts silently
      # on defaults: ICE range 50000-60000 instead of the 7882 mux, no TURN.
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - "0.0.0.0"
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        redis:
          address: redis:6379
        turn:
          enabled: true
          domain: ${TURN_DOMAIN}
          udp_port: 3478
          # TURN allocates a relay port per session. The default range is
          # 30000-40000, which is useless behind docker bridge networking
          # (10k published ports is not viable), so TURN would advertise
          # relays that never connect. Narrowed to a range we actually
          # publish + allow in ufw: 20 concurrent relay sessions, ample here.
          relay_range_start: 30000
          relay_range_end: 30019
          # TURN/TLS (5349) is intentionally OFF: it is raw TLS, not HTTP, so
          # Caddy cannot proxy it without the layer4 module, and LiveKit
          # terminating it itself needs a cert mounted in. TURN/UDP + ICE/TCP
          # (7881) cover everything except networks that block UDP *and*
          # non-443 TCP. See README "TURN TLS" to enable it later.
        logging:
          level: info
    ports:
      - "7881:7881"                  # WebRTC over TCP (ICE/TCP fallback)
      - "7882:7882/udp"              # WebRTC UDP mux
      - "3478:3478/udp"              # TURN/UDP
      - "30000-30019:30000-30019/udp"  # TURN relay range (see config above)
    networks:
      - web        # Caddy proxies wss://<LIVEKIT_DOMAIN> -> livekit:7880
      - internal
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks:
      - internal

  egress:
    image: livekit/egress:v1.9
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        log_level: info
    volumes:
      # Same host directory the server sees as /data/recordings — the egress
      # writes /out/<code>-<startedAt>.mp4 per the API contract.
      - ./data/server/recordings:/out
    # Room composite egress runs headless Chrome; it needs a big /dev/shm.
    shm_size: "1gb"
    networks:
      - internal
    depends_on:
      - livekit
      - redis

networks:
  web:
    external: true   # pre-existing network that Caddy is attached to
  internal:
