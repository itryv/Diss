# LiveKit production config for the Diss stack.
#
# API key/secret are NOT stored here — docker-compose.yml injects them via the
# LIVEKIT_KEYS environment variable (from deploy/.env), which LiveKit merges
# with this file.
#
# EDIT BEFORE FIRST USE: replace turn.example.com with your real TURN domain
# (the same value as TURN_DOMAIN in .env).

port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881       # published on the host (ufw allow 7881/tcp)
  udp_port: 7882       # UDP mux, published on the host (ufw allow 7882/udp)
  use_external_ip: true

redis:
  address: redis:6379

turn:
  enabled: true
  domain: turn.example.com   # <-- your TURN subdomain
  tls_port: 5349             # published on the host (ufw allow 5349/tcp)
  udp_port: 3478             # published on the host (ufw allow 3478/udp)
  # TLS for port 5349 — pick ONE of the following (see README "TURN TLS"):
  #  a) terminate TLS in a proxy in front of 5349 (e.g. Caddy with the
  #     layer4 module) and keep:
  external_tls: true
  #  b) let LiveKit terminate TLS itself: set external_tls: false, mount a
  #     cert for the TURN domain into the container, and uncomment:
  # cert_file: /etc/livekit-certs/turn.crt
  # key_file: /etc/livekit-certs/turn.key

logging:
  level: info
